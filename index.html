<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acero y Escamas | BLCKSCLE</title>

  <!-- Tipografías industriales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Oswald:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Cliente Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-carbon: #141a1a;
      --bg-petrol: #113a36;
      --bg-panel: #182020;
      --sage-header: #728e78;
      --sage-main: #75927e;
      --sage-muted: #3d5245;
      --cream-light: #f5f3eb;
      --text-muted: #8ea394;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-display: 'Oswald', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-carbon);
      color: var(--cream-light);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= CABEZAL VERDE SALVIA (DISEÑO CANVA) ================= */
    header {
      background-color: var(--sage-header);
      padding: 10px 36px 12px;
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      align-items: center;
    }

    .header-logo {
      width: 78px;
      height: 78px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
    }

    .header-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 4.5vw, 52px);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--bg-petrol);
      text-transform: uppercase;
      line-height: 0.95;
    }

    /* BLCKSCLE escalonado como en tu imagen */
    .brand-sub-stagger {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(18px, 2.2vw, 26px);
      color: var(--bg-petrol);
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: flex-start;
      margin-top: 2px;
    }

    .brand-sub-stagger .scle {
      transform: translateY(7px);
      display: inline-block;
    }

    /* Franja divisoria con líneas diagonales */
    .hazard-divider {
      height: 6px;
      background: repeating-linear-gradient(
        -55deg,
        #183536,
        #183536 22px,
        #9cb0a2 22px,
        #9cb0a2 24px
      );
      border-top: 1px solid #183536;
      border-bottom: 1px solid #263830;
    }

    /* ================= BARRA DE CATEGORÍAS ================= */
    .nav-container {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 24px 8px;
    }

    .categories-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .cat-label {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .cat-pills {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      flex-grow: 1;
      justify-content: space-around;
    }

    .cat-pill {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      background-color: var(--sage-header);
      color: var(--bg-petrol);
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 4px 28px 5px;
      cursor: pointer;
      transition: all 140ms ease;
      letter-spacing: 0.02em;
    }

    .cat-pill:hover,
    .cat-pill.active {
      background-color: var(--cream-light);
      color: var(--bg-carbon);
      border-color: var(--sage-main);
      transform: translateY(-1px);
    }

    .section-heading {
      text-align: center;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 14px 0 18px;
      letter-spacing: 0.03em;
      cursor: pointer;
    }

    .section-heading:hover {
      color: var(--cream-light);
    }

    /* ================= GRILLA DE PRODUCTOS (3 COLUMNAS) ================= */
    .catalog-wrapper {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px 48px;
      flex-grow: 1;
      width: 100%;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    @media (max-width: 980px) {
      .catalog-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      header { grid-template-columns: 64px 1fr; padding: 10px 16px; }
      .header-spacer { display: none; }
      .header-logo { width: 58px; height: 58px; }
      .catalog-grid { grid-template-columns: 1fr; }
    }

    /* TARJETA DE PRODUCTO */
    .product-card {
      background: var(--bg-panel);
      border: 1px solid var(--sage-muted);
      border-radius: 2px;
      text-decoration: none;
      color: var(--cream-light);
      display: flex;
      flex-direction: column;
      transition: all 150ms ease;
      position: relative;
    }

    .product-card:hover {
      border-color: var(--sage-main);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
    }

    /* Cuadrícula técnica de taller + miniaturas abajo a la derecha */
    .product-img-box {
      width: 100%;
      aspect-ratio: 1 / 0.92;
      background-color: #101515;
      background-image:
        linear-gradient(rgba(117,146,126,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(117,146,126,0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      border-bottom: 1px solid var(--sage-muted);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 150ms ease;
    }

    .badge-3d {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(20, 26, 26, 0.9);
      border: 1px solid var(--sage-main);
      color: var(--cream-light);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 2px;
      letter-spacing: 0.05em;
      z-index: 3;
    }

    /* Tira de 3 miniaturas en la esquina inferior derecha */
    .card-thumbs {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 3;
    }

    .card-thumb-item {
      width: 54px;
      height: 46px;
      border: 1px solid rgba(245, 243, 235, 0.35);
      background: #182020;
      overflow: hidden;
      border-radius: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .card-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-sku {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--sage-main);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .product-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
      color: var(--cream-light);
    }

    .product-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.42;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .product-price {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--cream-light);
      border-top: 1px solid rgba(117, 146, 126, 0.25);
      padding-top: 10px;
    }

    .price-currency {
      color: var(--sage-main);
      font-size: 13px;
      margin-right: 4px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-size: 13px;
      border: 1px dashed var(--sage-muted);
    }
  </style>
</head>
<body>

  <!-- CABEZAL PRINCIPAL CON PANGOLÍN Y BLCKSCLE ESCALONADO -->
  <header>
    <a href="index.html" title="Inicio">
      <img
        id="pangolinLogo"
        class="header-logo"
        src="assets/img/logo.png"
        alt="Logo Acero y Escamas"
      >
    </a>
    <div class="header-center">
      <h1 class="brand-title">ACERO Y ESCAMAS</h1>
      <div class="brand-sub-stagger">
        <span>BLCK</span><span class="scle">SCLE</span>
      </div>
    </div>
    <div class="header-spacer"></div>
  </header>

  <div class="hazard-divider"></div>

  <!-- BARRA DE CATEGORÍAS Y TÍTULO "INICIO" -->
  <section class="nav-container">
    <div class="categories-bar">
      <span class="cat-label" id="btnResetCats" title="Ver todos los muebles">Categorias</span>
      <div class="cat-pills" id="catPills">
        <button type="button" class="cat-pill" data-cat="Hogar">Hogar</button>
        <button type="button" class="cat-pill" data-cat="Gym">Gym</button>
        <button type="button" class="cat-pill" data-cat="Trailers">Trailers</button>
        <button type="button" class="cat-pill" data-cat="Variado">Variado</button>
        <button type="button" class="cat-pill" data-cat="Maquinas/Herramientas">Maquinas/Herramientas</button>
      </div>
    </div>

    <h2 class="section-heading" id="sectionTitle" title="Mostrar todo el catálogo">Inicio</h2>
  </section>

  <!-- GRILLA DE MUEBLES -->
  <main class="catalog-wrapper">
    <div class="catalog-grid" id="catalogoGrid">
      <div class="empty-state">Cargando catálogo del taller...</div>
    </div>
  </main>

    // CONEXIÓN A SUPABASE
    const SUPABASE_URL = 'https://ivyagavbhsyzvikzhmhe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2eWFnYXZiaHN5enZpa3pobWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MDMzMDIsImV4cCI6MjEwODk3OTMwMn0.c0beXPjYqt3X8PSs7xbKEmOuEhiAFvoQqNm4HC8iyPo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formatoPeso = new Intl.NumberFormat('es-AR', { style: 'decimal' });
    const grid = document.getElementById('catalogoGrid');
    const sectionTitle = document.getElementById('sectionTitle');

    let allProducts = [];
    let selectedCategory = null;

    function matchCategory(prodCat, filterCat) {
      if (!filterCat) return true;
      const pc = (prodCat || '').toLowerCase();
      const fc = filterCat.toLowerCase();
      if (fc === 'maquinas/herramientas') {
        return pc.includes('maquina') || pc.includes('máquina') || pc.includes('herramienta') || pc.includes('uso rudo');
      }
      return pc === fc;
    }

    function renderGrid() {
      grid.innerHTML = '';
      const filtered = allProducts.filter(p => matchCategory(p.categoria, selectedCategory));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No hay muebles cargados en "${selectedCategory || 'Inicio'}".</div>`;
        return;
      }

      filtered.forEach(prod => {
        const precio = prod.precio_base !== undefined ? prod.precio_base : prod.precioBase;
        const fotosArr = Array.isArray(prod.fotos) ? prod.fotos.filter(Boolean) : [];
        const miniThumbs = fotosArr.slice(0, 3);

        const card = document.createElement('a');
        card.href = `producto.html?id=${prod.id}`;
        card.className = 'product-card';

        const thumbsHtml = miniThumbs.length
          ? `<div class="card-thumbs">
              ${miniThumbs.map(f => `
                <div class="card-thumb-item">
                  <img src="${f}" alt="${prod.nombre}" loading="lazy" onerror="this.parentElement.style.display='none'">
                </div>
              `).join('')}
            </div>`
          : '';

        card.innerHTML = `
          <div class="product-img-box">
            <div class="badge-3d">⚙️ VISOR 3D</div>
            ${prod.imagen ? `<img class="product-main-img" src="${prod.imagen}" alt="${prod.nombre}" loading="lazy" onerror="this.style.display='none'">` : ''}
            ${thumbsHtml}
          </div>
          <div class="product-info">
            <span class="product-sku">REF: ${prod.sku}</span>
            <h2 class="product-title">${prod.nombre}</h2>
            <p class="product-desc">${prod.resumen || ''}</p>
            <div class="product-price"><span class="price-currency">$</span>${formatoPeso.format(precio)}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filtro por botones de categoría
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        if (selectedCategory === cat) {
          selectedCategory = null;
          document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
          sectionTitle.textContent = 'Inicio';
        } else {
          selectedCategory = cat;
          document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          sectionTitle.textContent = cat;
        }
        renderGrid();
      });
    });

    function resetFilter() {
      selectedCategory = null;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      sectionTitle.textContent = 'Inicio';
      renderGrid();
    }

    document.getElementById('btnResetCats').addEventListener('click', resetFilter);
    sectionTitle.addEventListener('click', resetFilter);

    async function cargarCatalogo() {
      try {
        const { data, error } = await supabaseClient.from('productos').select('*').eq('activo', true);
        if (!error && Array.isArray(data) && data.length > 0) {
          allProducts = data;
        } else {
          const res = await fetch('productos.json?v=' + Date.now());
          const localData = await res.json();
          allProducts = localData.filter(p => p.activo !== false);
        }
      } catch (e) {
        const res = await fetch('productos.json?v=' + Date.now());
        const localData = await res.json();
        allProducts = localData.filter(p => p.activo !== false);
      }

      renderGrid();
    }

    cargarCatalogo();
  </script>
